name: seal-build
on:
  workflow_dispatch: {}
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: braces-3.0.3
          path: braces-3.0.3.tgz
          if-no-files-found: error
